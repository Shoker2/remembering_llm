[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "remembering_llm"
version = "0.1.0"
description = "Обёртка над LangChain для создания LLM с кратковременной и долговременной памятью"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "TS2", email = "themallisteri@mail.ru"}
]
dependencies = [
    "langchain>=1.3.16",
    "langchain-openai>=1.6.0",
    "mem0ai[nlp]>=2.0.18",
]


[project.urls]
Homepage = "https://github.com/Shoker2/remembering_llm"

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = [
    "chromadb>=1.5.9",
    "aiosqlite>=0.22.1",
    "python-dotenv>=1.2.3",
    "sentence-transformers>=6.0.1",
]
